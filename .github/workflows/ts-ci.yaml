name: CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-*.yaml'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [26]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          # Error: The installed pnpm reports version 12.3.4, expected 12.4.0
          version: '12.3.4'
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # - name: Run tests
      #   run: pnpm run test

      - name: Build
        run: pnpm run build
