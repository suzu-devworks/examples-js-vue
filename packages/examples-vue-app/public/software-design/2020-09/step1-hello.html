<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Step 1 - Hello Vue</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h2>[Step-by-Step] Vue.js Course Understand the trends in JavaScript frameworks</h2>
        <p class="sub-title">Software Design 2020-09</p>
      </header>

      <main>
        <p>Hello {{world}}</p>
        <p>Counter: {{count}}</p>
        <p v-if="count == 5">見えたよ！</p>
        <input v-model="world" /><br />
        <input type="number" v-model="count" />
      </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const appdata = {
        data() {
          return {
            world: "Vue",
            count: 0,
          }
        },
      }
      Vue.createApp(appdata).mount("#app")
    </script>
  </body>
</html>
