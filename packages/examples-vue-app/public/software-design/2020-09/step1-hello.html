<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Step 1: Hello Vue - [Step-by-Step] Vue.js Course Understand the trends in JavaScript frameworks</title>
  </head>
  <body>
    <div id="app">
      <main>
        <p>Hello {{world}}</p>
        <p>Counter: {{count}}</p>
        <p v-if="count == 5">見えたよ！</p>
        <input v-model="world" name="world" /><br />
        <input type="number" v-model="count" name="count" />
      </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const appdata = {
        data() {
          return {
            world: 'Vue',
            count: 0,
          }
        },
      }
      Vue.createApp(appdata).mount('#app')
    </script>
  </body>
</html>
